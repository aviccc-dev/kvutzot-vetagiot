# בניית הגרסה למחשב (חלונות). רצה כשנדחף תג desktop-vX.Y.Z, או ידנית.
# קובץ ההתקנה של חלונות חייב להיבנות על חלונות, ולכן הבנייה כאן ולא בסביבה של Claude.
# התוצאה: דף הורדה (Release) עם שלושה קבצים:
#   small.zip — מפעיל קטן ו-kvutzot.jar (כ-0.2 מגה). משתמש ב-Java שכבר מותקנת במחשב (11 ומעלה).
#   full-setup.exe / full-portable.zip — עם Java בפנים (כ-28 מגה), בלי צורך בהתקנה נוספת.
name: windows

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: JAR (המוח מ-source, המסך מ-desktop)
        shell: bash
        run: bash desktop/build.sh build/in/kvutzot.jar

      - name: סביבת Java מצומצמת
        shell: bash
        run: |
          jlink --add-modules java.desktop,java.prefs,jdk.localedata,jdk.charsets \
            --include-locales=en,he --strip-debug --no-man-pages --no-header-files \
            --output build/runtime

      - name: תיקיית התוכנה (מופעלת בלי התקנה)
        shell: bash
        run: |
          V=$(cat desktop/version.txt)
          jpackage --type app-image --name KvutzotVeTagiot --app-version "$V" \
            --input build/in --main-jar kvutzot.jar --main-class com.aviccc.kvutzot.desktop.App \
            --runtime-image build/runtime --icon desktop/res/icon.ico --vendor aviccc \
            --description "Kvutzot ve-Tagiot" --dest build/image
          cd build/image && 7z a -tzip ../KvutzotVeTagiot-$V-full-portable.zip KvutzotVeTagiot > /dev/null
          ls -la ..

      - name: גרסה קטנה — מפעיל שבודק אם Java מותקנת, ו-kvutzot.jar
        shell: pwsh
        run: |
          $V = (Get-Content desktop/version.txt).Trim()
          $out = "build\small\KvutzotVeTagiot"
          New-Item -ItemType Directory -Force $out | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 `
            /win32icon:desktop\res\icon.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /out:$out\KvutzotVeTagiot.exe desktop\launcher\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\in\kvutzot.jar $out
          # בדיקה: המפעיל מוצא את ה-Java שמותקנת במכונה של הבנייה
          Start-Process "$out\KvutzotVeTagiot.exe" -ArgumentList '--test', "$PWD\build\found.txt" -Wait
          Get-Content build\found.txt
          if (-not (Select-String -Path build\found.txt -Pattern '^java=')) { Write-Error "המפעיל לא מצא Java"; exit 1 }
          Compress-Archive -Path $out -DestinationPath "build\KvutzotVeTagiot-$V-small.zip"
          Get-Item "build\KvutzotVeTagiot-$V-small.zip" | Select-Object Name, Length

      - name: קובץ התקנה (אם WiX קיים במכונה)
        id: installer
        continue-on-error: true
        shell: bash
        run: |
          V=$(cat desktop/version.txt)
          jpackage --type exe --name KvutzotVeTagiot --app-version "$V" \
            --app-image build/image/KvutzotVeTagiot \
            --win-per-user-install --win-menu --win-menu-group "Kvutzot ve-Tagiot" --win-shortcut --win-shortcut-prompt \
            --win-upgrade-uuid 6c1d6a2e-4f0b-4c1e-9a7e-2b8f3d4c5e61 --vendor aviccc \
            --description "Kvutzot ve-Tagiot" --dest build/installer
          ls -la build/installer

      - name: דף הורדה
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat desktop/version.txt)
          TAG=${GITHUB_REF_NAME}
          if [[ "$TAG" != desktop-v* ]]; then TAG="desktop-v$V"; fi
          FILES="build/KvutzotVeTagiot-$V-small.zip build/KvutzotVeTagiot-$V-full-portable.zip"
          if ls build/installer/*.exe > /dev/null 2>&1; then
            cp build/installer/*.exe "build/KvutzotVeTagiot-$V-full-setup.exe"
            FILES="$FILES build/KvutzotVeTagiot-$V-full-setup.exe"
          fi
          NOTES="notes/desktop-$V.md"
          gh release view "$TAG" > /dev/null 2>&1 && gh release upload "$TAG" $FILES --clobber \
            || gh release create "$TAG" $FILES --title "קבוצות ותגיות למחשב $V" --notes-file "$NOTES"
